<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rentoby - Wishlist</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
    }

    header {
      background: #222;
      color: #fff;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-icons a {
      color: #fff;
      margin-left: 1rem;
      text-decoration: none;
    }

    section {
      padding: 1rem;
    }

    .wishlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }

    .wishlist-item {
      background: #fff;
      padding: 1rem;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .wishlist-item img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    footer {
      background: #eee;
      padding: 1rem;
      display: flex;
      justify-content: space-around;
      position: fixed;
      bottom: 0;
      width: 100%;
    }

    footer a {
      text-decoration: none;
      color: #333;
      text-align: center;
      font-size: 0.9rem;
    }

    footer i {
      display: block;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

<header>
  <h1>Rentoby</h1>
  <div class="nav-icons">
    <a href="like.html"><i class="fa-regular fa-heart"></i></a>
    <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i></a>
  </div>
</header>

<section>
  <h2>Wishlist</h2>
  <div class="wishlist-grid">
    <div class="wishlist-item">
      <img src="https://via.placeholder.com/200x150" alt="Item">
      <p>Cozy Sofa</p>
      <button>Add to Cart</button>
    </div>
    <div class="wishlist-item">
      <img src="https://via.placeholder.com/200x150" alt="Item">
      <p>Modern Chair</p>
      <button>Add to Cart</button>
    </div>
  </div>
</section>

<footer>
  <a href="index.html"><i class="fa-solid fa-house"></i>Home</a>
  <a href="buy.html"><i class="fa-solid fa-couch"></i>Buy</a>
  <a href="rent.html"><i class="fa-solid fa-bed"></i>Rent</a>
  <a href="like.html"><i class="fa-regular fa-heart"></i>Wishlist</a>
  <a href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
</footer>

</body>
</html>
