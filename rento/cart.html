<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rentoby - Cart</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fdfdfd;
    }

    header {
      background: #222;
      color: #fff;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-icons a {
      color: #fff;
      margin-left: 1rem;
      text-decoration: none;
    }

    section {
      padding: 1rem;
    }

    .cart-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .cart-item {
      background: #fff;
      padding: 1rem;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.1);
    }

    .cart-item img {
      width: 100px;
      height: auto;
      border-radius: 8px;
    }

    .cart-info {
      flex: 1;
      margin-left: 1rem;
    }

    .cart-total {
      margin-top: 1rem;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: right;
    }

    footer {
      background: #eee;
      padding: 1rem;
      display: flex;
      justify-content: space-around;
      position: fixed;
      bottom: 0;
      width: 100%;
    }

    footer a {
      text-decoration: none;
      color: #333;
      text-align: center;
      font-size: 0.9rem;
    }

    footer i {
      display: block;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

<header>
  <h1>Rentoby</h1>
  <div class="nav-icons">
    <a href="like.html"><i class="fa-regular fa-heart"></i></a>
    <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i></a>
  </div>
</header>

<section>
  <h2>Your Cart</h2>
  <div class="cart-grid">
    <div class="cart-item">
      <img src="https://via.placeholder.com/100x80" alt="Item">
      <div class="cart-info">
        <p>Wooden Bed</p>
        <p>$150</p>
      </div>
      <button>Remove</button>
    </div>
    <div class="cart-item">
      <img src="https://via.placeholder.com/100x80" alt="Item">
      <div class="cart-info">
        <p>Dining Set</p>
        <p>$220</p>
      </div>
      <button>Remove</button>
    </div>
  </div>
  <div class="cart-total">Total: $370</div>
</section>

<footer>
  <a href="index.html"><i class="fa-solid fa-house"></i>Home</a>
  <a href="buy.html"><i class="fa-solid fa-couch"></i>Buy</a>
  <a href="rent.html"><i class="fa-solid fa-bed"></i>Rent</a>
  <a href="like.html"><i class="fa-regular fa-heart"></i>Wishlist</a>
  <a href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
</footer>

</body>
</html>
