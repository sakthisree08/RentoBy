<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rentoby - Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    :root {
      --bg-color: #0d0d1a;
      --text-color: #e4e4e4;
      --card-bg: #1b1b2f;
      --header-bg: #12122a;
      --footer-bg: #12122a;
      --primary: #00e0d0;
      --secondary: #8a7aff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 80px;
      transition: background 0.5s ease, color 0.5s ease;
    }

    header {
      background: var(--header-bg);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      position: sticky;
      top: 0;
      z-index: 1000;
      animation: fadeInDown 0.6s ease-out;
    }

    header h1 {
      color: var(--primary);
      font-weight: bold;
    }

    .nav-icons {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .nav-icons a, .toggle-theme {
      color: var(--text-color);
      font-size: 20px;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .nav-icons a:hover, .toggle-theme:hover {
      color: var(--primary);
    }

    .category-section {
      padding: 20px;
      animation: fadeInUp 0.8s ease forwards;
    }

    .category-section h2 {
      margin-bottom: 15px;
      font-size: 22px;
      color: var(--primary);
      animation: slideInLeft 0.6s ease-in-out;
    }

    .card-container {
      display: flex;
      overflow-x: auto;
      flex-wrap: nowrap;
      gap: 20px;
      padding-bottom: 10px;
      scroll-snap-type: x mandatory;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      min-width: 200px;
      flex: 0 0 auto;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      overflow: hidden;
      scroll-snap-align: start;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 12px 25px rgba(0,224,208,0.15);
    }

    .card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }

   .card-content {
  padding: 15px;
  text-align: center;
  position: relative;
  height: 100px;
}

.card .hover-info {
  position: absolute;
  bottom: -100%;
  left: 0;
  right: 0;
  background: rgba(0, 224, 208, 0.1);
  backdrop-filter: blur(4px);
  padding: 10px;
  opacity: 0;
  transition: all 0.4s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  font-size: 14px;
  border-top: 1px solid var(--primary);
}

.card:hover .hover-info {
  bottom: 0;
  opacity: 1;
}

.hover-info button, .hover-info .icon-btn {
  background: none;
  border: none;
  color: var(--text-color);
  cursor: pointer;
  font-size: 16px;
  padding: 4px 10px;
  transition: transform 0.2s ease, color 0.2s;
}

.hover-info .icon-btn:hover,
.hover-info button:hover {
  transform: scale(1.2);
  color: var(--primary);
}

.hover-info .action-buttons {
  display: flex;
  gap: 12px;
  margin-top: 5px;
}


    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--footer-bg);
      border-top: 1px solid #2e2e44;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      box-shadow: 0 -2px 6px rgba(0,0,0,0.2);
      z-index: 1000;
    }

    footer a {
      text-decoration: none;
      color: var(--text-color);
      font-size: 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: color 0.3s;
    }

    footer a:hover {
      color: var(--primary);
    }

    footer a.active {
      color: var(--primary);
    }

    footer a i {
      font-size: 18px;
      margin-bottom: 3px;
    }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-25px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>

<header>
  <h1>Rentoby</h1>
  <div class="nav-icons">
    <a href="like.html"><i class="fa-regular fa-heart"></i></a>
    <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i></a>
  </div>
</header>

<div id="sections"></div>

<footer>
  <a href="index.html" class="active"><i class="fa-solid fa-house"></i><span>Home</span></a>
  <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i><span>Cart</span></a>
  <a href="profile.html"><i class="fa-solid fa-user"></i><span>Profile</span></a>
  <a href="settings.html"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
</footer>

    const div = document.createElement("div");
    div.className = "category-section";
    div.innerHTML = `

            <div class="card-content">

  }
</script>

</body>
</html>
