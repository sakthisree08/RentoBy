<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cart — Rentoby</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .cart-layout { display: grid; grid-template-columns: 1fr 340px; gap: 32px; align-items: start; }
    .cart-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    .cart-item:hover { border-color: rgba(56,189,248,0.2); }
    .cart-item-img { width: 90px; height: 90px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-mode-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .badge-buy { background: rgba(56,189,248,0.15); color: var(--primary); }
    .badge-rent { background: rgba(139,92,246,0.15); color: var(--secondary); }
    .cart-item-name { font-weight: 700; font-size: 1rem; margin-bottom: 4px; font-family:'Syne',sans-serif; }
    .cart-item-price { color: var(--primary); font-weight: 700; font-size: 1.05rem; }
    .cart-item-period { font-size: 0.78rem; color: var(--text-muted); }
    .qty-control {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .qty-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .qty-btn:hover { background: rgba(56,189,248,0.08); color: var(--primary); }
    .qty-num { width: 40px; text-align: center; font-weight: 700; font-size: 0.95rem; }
    .cart-item-remove {
      width: 36px; height: 36px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .cart-item-remove:hover { background: rgba(239,68,68,0.1); color: var(--danger); }
    .cart-right-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      position: sticky;
      top: calc(var(--nav-h) + 20px);
    }
    .cart-right-panel h3 { font-size: 1.1rem; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .cart-summary-row { display: flex; justify-content: space-between; margin-bottom: 14px; font-size: 0.9rem; color: var(--text-muted); }
    .cart-summary-row.total { font-size: 1.1rem; font-weight: 800; color: var(--text); padding-top: 14px; border-top: 1px solid var(--border); margin-top: 14px; }
    .cart-summary-row span:last-child { color: var(--text); }
    .cart-summary-row.total span:last-child { color: var(--primary); font-size: 1.3rem; }
    .coupon-input { display: flex; gap: 8px; margin: 20px 0; }
    .coupon-input input { flex: 1; background: var(--card2); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; outline: none; }
    .coupon-input input:focus { border-color: var(--primary); }
    .coupon-input button { background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.2); color: var(--primary); padding: 10px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .coupon-input button:hover { background: rgba(56,189,248,0.2); }
    .checkout-btn { width: 100%; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; padding: 15px; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s; border: none; font-family: inherit; }
    .checkout-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(56,189,248,0.3); }
    .cart-trust { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .trust-item { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-muted); }
    .cart-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .clear-cart-btn { font-size: 0.82rem; color: var(--danger); cursor: pointer; transition: opacity 0.2s; }
    .clear-cart-btn:hover { opacity: 0.7; }
    @media(max-width:1024px){ .cart-layout { grid-template-columns: 1fr; } .cart-right-panel { position: static; } }
    @media(max-width:600px){ .cart-item { flex-wrap: wrap; } .cart-item-img { width: 70px; height: 70px; } }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="../index.html" class="nav-logo"><span class="logo-r">R</span> Rento<span>by</span></a>
    <ul class="nav-links" id="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="buy.html">Buy</a></li>
      <li><a href="rent.html">Rent</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="help.html">Help</a></li>
    </ul>
    <div class="nav-right">
      <a href="wishlist.html" class="nav-icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span class="wishlist-badge">0</span>
      </a>
      <a href="cart.html" class="nav-icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-badge">0</span>
      </a>
      <a href="profile.html" class="btn-nav-cta">Profile</a>
      <button class="menu-toggle" id="menu-toggle"><span></span><span></span><span></span></button>
    </div>
  </div>
</nav>

<div class="page-header">
  <div class="container">
    <span class="section-tag">Shopping Cart</span>
    <h1>My Cart</h1>
    <p>Review your selections before checkout.</p>
  </div>
</div>

<div class="container section-sm">
  <div id="cart-content"></div>
</div>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© 2025 Rentoby. All rights reserved.</span>
      <a href="../index.html" style="color:var(--primary)">← Back to Home</a>
    </div>
  </div>
</footer>

<script src="../js/products.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/main.js"></script>
<script>
  function renderCart() {
    const items = Cart.getAll();
    const container = document.getElementById('cart-content');

    if (!items.length) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🛒</div>
          <h3>Your cart is empty</h3>
          <p>Looks like you haven't added anything yet. Start browsing!</p>
          <a href="buy.html" class="btn btn-primary">Shop Now</a>
        </div>`;
      return;
    }

    const subtotal = Cart.total();
    const delivery = 0;
    const discount = 0;
    const total = subtotal + delivery - discount;

    container.innerHTML = `
      <div class="cart-layout">
        <div>
          <div class="cart-header-row">
            <h2 style="font-size:1.1rem">${items.length} item${items.length>1?'s':''} in your cart</h2>
            <span class="clear-cart-btn" onclick="clearAll()">Clear all</span>
          </div>
          <div id="cart-items">
            ${items.map(item => `
              <div class="cart-item slide-up" data-key="${item.key}">
                <img class="cart-item-img" src="${item.image}" alt="${item.name}"
                     onerror="this.src='https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=200&q=80'">
                <div class="cart-item-info">
                  <span class="cart-mode-badge badge-${item.mode}">${item.mode === 'buy' ? 'Purchase' : `Rent / ${item.rentPeriod}`}</span>
                  <div class="cart-item-name">${item.name}</div>
                  <div class="cart-item-price">₹${item.price.toLocaleString('en-IN')}
                    ${item.mode === 'rent' ? `<span class="cart-item-period">/${item.rentPeriod === 'daily' ? 'day' : item.rentPeriod === 'weekly' ? 'wk' : 'mo'}</span>` : ''}
                  </div>
                </div>
                <div class="qty-control">
                  <button class="qty-btn" onclick="changeQty('${item.key}', ${item.qty - 1})">−</button>
                  <span class="qty-num">${item.qty}</span>
                  <button class="qty-btn" onclick="changeQty('${item.key}', ${item.qty + 1})">+</button>
                </div>
                <div style="text-align:right; min-width:90px">
                  <div style="font-weight:700; font-family:'Syne',sans-serif; color:var(--primary)">
                    ₹${(item.price * item.qty).toLocaleString('en-IN')}
                  </div>
                </div>
                <button class="cart-item-remove" onclick="removeItem('${item.key}')" title="Remove">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                    <path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                  </svg>
                </button>
              </div>`).join('')}
          </div>
        </div>

        <div class="cart-right-panel">
          <h3>Order Summary</h3>
          <div class="cart-summary-row"><span>Subtotal (${items.reduce((s,i)=>s+i.qty,0)} items)</span><span>₹${subtotal.toLocaleString('en-IN')}</span></div>
          <div class="cart-summary-row"><span>Delivery</span><span style="color:var(--success)">FREE</span></div>
          <div class="cart-summary-row"><span>Assembly</span><span style="color:var(--success)">FREE</span></div>
          <div class="coupon-input">
            <input type="text" placeholder="Coupon code" id="coupon-input">
            <button onclick="applyCoupon()">Apply</button>
          </div>
          <div class="cart-summary-row total"><span>Total</span><span>₹${total.toLocaleString('en-IN')}</span></div>
          <button class="checkout-btn btn-ripple" onclick="checkout()">Proceed to Checkout →</button>
          <div class="cart-trust">
            <div class="trust-item">🔒 Secure 256-bit SSL payment</div>
            <div class="trust-item">↩️ Free returns within 7 days</div>
            <div class="trust-item">🚚 Free delivery & setup</div>
          </div>
        </div>
      </div>`;

    initScrollAnimations();
  }

  function changeQty(key, qty) {
    Cart.updateQty(key, qty);
    renderCart();
  }

  function removeItem(key) {
    Cart.remove(key);
    renderCart();
  }

  function clearAll() {
    if (confirm('Remove all items from cart?')) {
      Cart.clear();
      renderCart();
    }
  }

  function applyCoupon() {
    const val = document.getElementById('coupon-input')?.value;
    showToast(val ? `Coupon "${val}" is not valid.` : 'Enter a coupon code.', 'info');
  }

  function checkout() {
    showToast('🎉 Order placed successfully! (Demo)', 'success');
    setTimeout(() => {
      Cart.clear();
      renderCart();
    }, 1500);
  }

  document.addEventListener('cartUpdated', renderCart);
  renderCart();
</script>
</body>
</html>
