<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist — Rentoby</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .wishlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }
    .wish-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
      position: relative;
    }
    .wish-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
      border-color: rgba(139,92,246,0.3);
    }
    .wish-img-wrap { position: relative; aspect-ratio: 4/3; overflow: hidden; }
    .wish-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
    .wish-card:hover .wish-img-wrap img { transform: scale(1.06); }
    .wish-remove {
      position: absolute;
      top: 12px; right: 12px;
      width: 34px; height: 34px;
      background: rgba(10,15,30,0.8);
      backdrop-filter: blur(8px);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #ef4444;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 1;
    }
    .wish-remove:hover { background: rgba(239,68,68,0.2); transform: scale(1.1); }
    .wish-body { padding: 16px 18px 18px; }
    .wish-cat { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--secondary); }
    .wish-name { font-size: 1rem; font-weight: 700; font-family: 'Syne', sans-serif; margin: 6px 0 4px; }
    .wish-price { font-size: 1.15rem; font-weight: 800; color: var(--primary); margin-bottom: 14px; }
    .wish-actions { display: flex; gap: 8px; }
    .btn-move-cart {
      flex: 1;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.2s;
    }
    .btn-move-cart:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-rent-wish {
      flex: 1;
      background: rgba(139,92,246,0.12);
      border: 1px solid rgba(139,92,246,0.3);
      color: var(--secondary);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-rent-wish:hover { background: rgba(139,92,246,0.22); }
    .wishlist-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .wishlist-count-badge {
      background: rgba(139,92,246,0.15);
      color: var(--secondary);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="../index.html" class="nav-logo"><span class="logo-r">R</span> Rento<span>by</span></a>
    <ul class="nav-links" id="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="buy.html">Buy</a></li>
      <li><a href="rent.html">Rent</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="help.html">Help</a></li>
    </ul>
    <div class="nav-right">
      <a href="wishlist.html" class="nav-icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span class="wishlist-badge">0</span>
      </a>
      <a href="cart.html" class="nav-icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-badge">0</span>
      </a>
      <a href="profile.html" class="btn-nav-cta">Profile</a>
      <button class="menu-toggle" id="menu-toggle"><span></span><span></span><span></span></button>
    </div>
  </div>
</nav>

<div class="page-header">
  <div class="container">
    <span class="section-tag">Saved Items</span>
    <h1>My <span style="color:var(--secondary)">Wishlist</span></h1>
    <p>Items you've saved for later. Move to cart whenever you're ready.</p>
  </div>
</div>

<div class="container section-sm">
  <div id="wishlist-content"></div>
</div>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© 2025 Rentoby. All rights reserved.</span>
      <a href="../index.html" style="color:var(--primary)">← Back to Home</a>
    </div>
  </div>
</footer>

<script src="../js/products.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/main.js"></script>
<script>
  function renderWishlist() {
    const ids = Wishlist.getAll();
    const container = document.getElementById('wishlist-content');

    if (!ids.length) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">💜</div>
          <h3>Your wishlist is empty</h3>
          <p>Save furniture you love by clicking the heart icon on any product.</p>
          <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
            <a href="buy.html" class="btn btn-primary">Shop to Buy</a>
            <a href="rent.html" class="btn btn-secondary">Browse Rentals</a>
          </div>
        </div>`;
      return;
    }

    const products = ids.map(id => getProductById(id)).filter(Boolean);

    container.innerHTML = `
      <div class="wishlist-header-row">
        <h2 style="font-size:1.1rem">Saved Items</h2>
        <span class="wishlist-count-badge">${products.length} item${products.length !== 1 ? 's' : ''}</span>
      </div>
      <div class="wishlist-grid">
        ${products.map(p => `
          <div class="wish-card slide-up" data-id="${p.id}">
            <div class="wish-img-wrap">
              <img src="${p.image}" alt="${p.name}"
                   onerror="this.src='https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600&q=80'">
              <button class="wish-remove" onclick="removeWish(${p.id})" title="Remove from wishlist">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
              </button>
            </div>
            <div class="wish-body">
              <div class="wish-cat">${p.category.replace('-', ' ')}</div>
              <div class="wish-name">${p.name}</div>
              <div class="wish-price">₹${p.buyPrice.toLocaleString('en-IN')}</div>
              <div class="wish-actions">
                <button class="btn-move-cart" onclick="moveToBuyCart(${p.id})">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                  Buy
                </button>
                <button class="btn-rent-wish" onclick="moveToRentCart(${p.id})">Rent</button>
              </div>
            </div>
          </div>`).join('')}
      </div>`;

    initScrollAnimations();
  }

  function removeWish(id) {
    Wishlist.remove(id);
    renderWishlist();
  }

  function moveToBuyCart(id) {
    const product = getProductById(id);
    if (!product) return;
    Cart.add(product, 'buy', 'monthly');
    Wishlist.remove(id);
    renderWishlist();
  }

  function moveToRentCart(id) {
    const product = getProductById(id);
    if (!product) return;
    Cart.add(product, 'rent', 'monthly');
    Wishlist.remove(id);
    renderWishlist();
  }

  document.addEventListener('wishlistUpdated', renderWishlist);
  renderWishlist();
</script>
</body>
</html>
